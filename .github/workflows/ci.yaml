name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A push that lands while the previous one is still building makes the older answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The unit tests and the static checks run as two jobs side by side, because one after the other
  # they took longer than the instrumentation job. `check` is the name the ruleset requires, so it
  # stays as the job that passes only when both did.
  check:
    needs: [unit-tests, static-checks]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Unit tests and static checks passed
        env:
          UNIT_TESTS: ${{ needs.unit-tests.result }}
          STATIC_CHECKS: ${{ needs.static-checks.result }}
        run: |
          echo "unit-tests: $UNIT_TESTS, static-checks: $STATIC_CHECKS"
          test "$UNIT_TESTS" = success && test "$STATIC_CHECKS" = success

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      # JDK 17 and ktlint come from the flake, so CI runs the versions the devshell pins rather
      # than whatever the runner image happens to ship this month.
      - uses: $/.github/actions/setup-nix

      # Caches the Gradle distribution and the dependency set, which is most of a cold run. It
      # also verifies the committed `gradle-wrapper.jar` against Gradle's published checksums,
      # which is worth having for a jar that lives in the repository.
      #
      # Read-only off main: a pull request reads the cache but does not write one back, which
      # skips a post-job upload that can cost more than the run it followed.
      #
      # Gradle's configuration cache is on in gradle.properties but does not survive between runs
      # here — this action only stores it when given an encryption key, since it can hold secrets.
      # Each run reconfigures. That costs seconds, and is worth knowing before someone spends an
      # afternoon asking why the cache never hits.
      - uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # The Android SDK comes from the runner image, which sets ANDROID_HOME; the flake's
      # shellHook takes it rather than overriding it.
      #
      # `./gw` is deliberately not used anywhere here: it is `nix develop --command ./gradlew`,
      # and every step is already inside the devshell.
      #
      # `:app`'s unit tests are excluded from the release variant: `test` would otherwise run the
      # same tests twice, and the release variant differs only by minification, which a unit
      # test never reaches.
      #
      # The throughput benchmark is left in. It asserts absolute rates on a shared runner, which is
      # the obvious thing to flake, and `-PskipPerfTests` exists for when it does — but switching
      # it off before it has failed once would remove the measurement on a guess.
      - name: Unit tests
        run: nix develop -c ./gradlew test -x :app:testReleaseUnitTest

      - name: Reports
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: unit-test-reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
          if-no-files-found: ignore

  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/setup-nix

      # Before the Gradle cache, not after: ktlint needs no Gradle, and a formatting slip should
      # not first pay a minute to restore a cache it will never use.
      - name: Lint (ktlint)
        run: nix develop -c ktlint

      - uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Android Lint
        run: nix develop -c ./gradlew :app:lintDebug

      # The unit tests compile the app's Kotlin, so this is not here for that. It is here for
      # everything after compilation — merging resources and the manifest, dexing, packaging —
      # none of which a unit test touches and any of which can break on its own.
      - name: Assemble
        run: nix develop -c ./gradlew :app:assembleDebug

      - name: Reports
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: static-check-reports
          path: |
            **/build/reports/
          retention-days: 7
          if-no-files-found: ignore

  # A job of its own: booting an emulator and running the suite takes longer than any other job,
  # and side by side none waits on another.
  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/.github/actions/setup-nix
      - uses: gradle/actions/setup-gradle@v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # For SshOnAndroidTest's end-to-end case. Started without waiting for it to listen: the build
      # and the emulator boot that come first take minutes, and with sshHost given the test fails
      # rather than skips when nothing answers, so a server that never came up still shows. The
      # password is fixed because the runner is a throwaway machine nothing else reaches.
      - name: Test SSH server
        run: nohup tools/sshd --port 2222 --password testpass > "$RUNNER_TEMP/sshd.log" 2>&1 &

      # The emulator, its system image and the AVD with the boot snapshot Gradle takes of it. Without
      # them the job downloads about 2.5 GB from Google, whose speed varies from run to run, and boots
      # the emulator cold to take the snapshot: a minute it spends after the APKs are already built.
      # Gradle checks that a restored snapshot is loadable and takes a new one when it is not, so a
      # stale cache costs that minute rather than breaking the run, and the save below replaces it.
      - name: Restore the emulator
        id: emulator-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.config/.android/avd/gradle-managed
            /usr/local/lib/android/sdk/emulator
            /usr/local/lib/android/sdk/system-images/android-36/aosp_atd/x86_64
          key: emulator-${{ runner.os }}-${{ hashFiles('app/build.gradle.kts', 'gradle/libs.versions.toml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: emulator-${{ runner.os }}-${{ hashFiles('app/build.gradle.kts', 'gradle/libs.versions.toml') }}-

      - name: Fingerprint the restored snapshot
        run: echo "SNAPSHOT_BEFORE=$(cat ~/.config/.android/avd/gradle-managed/*.avd/snapshots/default_boot/snapshot.pb 2>/dev/null | sha256sum)" >> "$GITHUB_ENV"
      - name: Make the restored snapshot stale (experiment)
        run: echo "hw.ramSize = 1999" >> ~/.config/.android/avd/gradle-managed/*.avd/snapshots/default_boot/hardware.ini

      # The runner has /dev/kvm but only root may open it; without it the emulator falls back to
      # software emulation, too slow to boot inside the timeout.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # A Gradle-managed emulator (`ci` in app/build.gradle.kts): Gradle downloads the image,
      # boots it, runs the suite and shuts it down, so there is no emulator action to pin.
      # The software renderer because the runner has no GPU.
      - name: Instrumentation tests
        run: >-
          nix develop -c ./gradlew :app:ciDebugAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          -Pandroid.testInstrumentationRunnerArguments.sshHost=10.0.2.2

      # Saved when Gradle took a snapshot this run, so a cache it could not use is replaced rather
      # than restored and thrown away on every run. Main only, like the Gradle cache.
      - name: Check whether the snapshot changed
        id: snapshot
        run: |
          after=$(cat ~/.config/.android/avd/gradle-managed/*.avd/snapshots/default_boot/snapshot.pb 2>/dev/null | sha256sum)
          if [ "$after" != "$SNAPSHOT_BEFORE" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Save the emulator
        if: ${{ true && steps.snapshot.outputs.changed == 'true' }}
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.config/.android/avd/gradle-managed
            /usr/local/lib/android/sdk/emulator
            /usr/local/lib/android/sdk/system-images/android-36/aosp_atd/x86_64
          key: ${{ steps.emulator-cache.outputs.cache-primary-key }}

      # On success too: the per-test times in the results are how a slow test gets found, and a
      # passing run is the only kind that has all of them.
      - name: Reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: instrumentation-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            ${{ runner.temp }}/sshd.log
          retention-days: 7
          if-no-files-found: ignore
